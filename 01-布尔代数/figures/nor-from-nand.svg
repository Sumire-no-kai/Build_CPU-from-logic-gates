<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">用非门与与非门组成或非门</title>
  <desc id="desc">A 经过 NOT 得到 U，B 经过 NOT 得到 V；U 和 V 进入 NAND 得到 X；X 再经过 NOT 得到 Q。</desc>
  <style>
    .wire { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #eaf3ff; stroke: #334155; stroke-width: 3; }
    .label { fill: #0f172a; font: 17px system-ui, sans-serif; }
    .name { fill: #0f172a; font: 600 17px system-ui, sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .wire { stroke: #cbd5e1; }
      .gate { fill: #173454; stroke: #cbd5e1; }
      .label, .name { fill: #f1f5f9; }
    }
  </style>
  <path class="wire" d="M 50 50 H 150 M 250 50 H 310 V 65 H 350 M 50 140 H 150 M 250 140 H 310 V 125 H 350 M 470 95 H 530 M 630 95 H 710" />
  <rect class="gate" x="150" y="20" width="100" height="60" rx="12" />
  <rect class="gate" x="150" y="110" width="100" height="60" rx="12" />
  <rect class="gate" x="350" y="40" width="120" height="110" rx="12" />
  <rect class="gate" x="530" y="60" width="100" height="70" rx="12" />
  <text class="name" x="200" y="56">NOT</text>
  <text class="name" x="200" y="146">NOT</text>
  <text class="name" x="410" y="102">NAND</text>
  <text class="name" x="580" y="102">NOT</text>
  <text class="label" x="17" y="56">A</text>
  <text class="label" x="17" y="146">B</text>
  <text class="label" x="278" y="43">U</text>
  <text class="label" x="278" y="162">V</text>
  <text class="label" x="495" y="84">X</text>
  <text class="label" x="718" y="101">Q</text>
</svg>
