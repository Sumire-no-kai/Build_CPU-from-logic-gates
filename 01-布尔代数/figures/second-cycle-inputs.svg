<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-labelledby="title desc">
  <title id="title">按当前两路输入判断的组合电路</title>
  <desc id="desc">输入 A 直接进入 AND；输入 B 经过 NOT 后进入 AND。输出仅在 A 为真、B 为假时为真。</desc>
  <style>
    .wire { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #eaf3ff; stroke: #334155; stroke-width: 3; }
    .label { fill: #0f172a; font: 17px system-ui, sans-serif; }
    .name { fill: #0f172a; font: 600 17px system-ui, sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .wire { stroke: #cbd5e1; }
      .gate { fill: #173454; stroke: #cbd5e1; }
      .label, .name { fill: #f1f5f9; }
    }
  </style>
  <path class="wire" d="M 50 50 H 310 V 80 H 350 M 50 140 H 150 M 250 140 H 310 V 130 H 350 M 480 105 H 560" />
  <rect class="gate" x="150" y="110" width="100" height="60" rx="12" />
  <rect class="gate" x="350" y="55" width="130" height="100" rx="12" />
  <text class="name" x="200" y="146">NOT</text>
  <text class="name" x="415" y="112">AND</text>
  <text class="label" x="17" y="56">A</text>
  <text class="label" x="17" y="146">B</text>
  <text class="label" x="568" y="111">Q</text>
</svg>
