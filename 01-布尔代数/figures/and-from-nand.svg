<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" role="img" aria-labelledby="title desc">
  <title id="title">用与非门和非门组成与门</title>
  <desc id="desc">输入 A 和 B 先接入 NAND，再将结果接入 NOT，输出 Q 等于 A AND B。</desc>
  <style>
    .wire { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #eaf3ff; stroke: #334155; stroke-width: 3; }
    .label { fill: #0f172a; font: 17px system-ui, sans-serif; }
    .name { fill: #0f172a; font: 600 18px system-ui, sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .wire { stroke: #cbd5e1; }
      .gate { fill: #173454; stroke: #cbd5e1; }
      .label, .name { fill: #f1f5f9; }
    }
  </style>
  <path class="wire" d="M 60 55 H 180 M 60 105 H 180 M 310 80 H 375 M 485 80 H 600" />
  <rect class="gate" x="180" y="25" width="130" height="110" rx="12" />
  <rect class="gate" x="375" y="45" width="110" height="70" rx="12" />
  <text class="name" x="245" y="87">NAND</text>
  <text class="name" x="430" y="87">NOT</text>
  <text class="label" x="27" y="61">A</text>
  <text class="label" x="27" y="111">B</text>
  <text class="label" x="335" y="69">X</text>
  <text class="label" x="608" y="86">Q</text>
</svg>
