<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">两个与非门构成的或门</title>
  <desc id="desc">A 与第一路 NOT B 进入第一个 NAND，结果 X 与第二路 NOT B 进入第二个 NAND，得到 OR。</desc>
  <style>
    .wire { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gate { fill: #eaf3ff; stroke: #334155; stroke-width: 3; }
    .dot { fill: #334155; }
    .label { fill: #0f172a; font: 17px system-ui, sans-serif; }
    .name { fill: #0f172a; font: 600 17px system-ui, sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .wire { stroke: #cbd5e1; }
      .gate { fill: #173454; stroke: #cbd5e1; }
      .dot { fill: #cbd5e1; }
      .label, .name { fill: #f1f5f9; }
    }
  </style>
  <path class="wire" d="M 45 50 H 360 M 45 215 H 115 V 100 H 160 M 115 215 H 160 M 270 100 H 320 V 90 H 360 M 270 215 H 550 V 180 H 600 M 480 70 H 540 V 145 H 600 M 720 160 H 780" />
  <circle class="dot" cx="115" cy="215" r="5" />
  <rect class="gate" x="160" y="75" width="110" height="50" rx="12" />
  <rect class="gate" x="160" y="190" width="110" height="50" rx="12" />
  <rect class="gate" x="360" y="25" width="120" height="90" rx="12" />
  <rect class="gate" x="600" y="115" width="120" height="90" rx="12" />
  <text class="name" x="215" y="106">NOT</text>
  <text class="name" x="215" y="221">NOT</text>
  <text class="name" x="420" y="77">NAND</text>
  <text class="name" x="660" y="167">NAND</text>
  <text class="label" x="13" y="56">A</text>
  <text class="label" x="13" y="221">B</text>
  <text class="label" x="500" y="62">X</text>
  <text class="label" x="788" y="166">Q</text>
</svg>
