<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">八个全加器构成带输入输出进位的单字节加法器</title><desc id="desc">Ai与Bi接第i个全加器，c0为外部Cin，c1到c7连接相邻全加器，c8为外部Cout。Si合成输出字节S。全加器上端是输入进位，下端是输出进位。</desc>
