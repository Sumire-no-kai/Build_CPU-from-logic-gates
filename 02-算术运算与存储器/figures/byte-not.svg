<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">单字节非门的八条并行支路</title>
<desc id="desc">输入字节通过分线器拆成八位，权重1、2、4、8、16、32、64、128各经过一只NOT，再接入集线器相同权重的输入，合成输出字节。</desc>
<style>
.wire{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round}.bus{fill:none;stroke:#334155;stroke-width:7;stroke-linecap:round}
.gate{fill:#eaf3ff;stroke:#334155;stroke-width:3}.label{fill:#0f172a;font:18px system-ui,sans-serif}
.name{fill:#0f172a;font:600 20px system-ui,sans-serif;text-anchor:middle}
@media(prefers-color-scheme:dark){.wire,.bus,.gate{stroke:#cbd5e1}.gate{fill:#173454}.label,.name{fill:#f1f5f9}}
</style>
<path class="bus" d="M 40 300 H 180 M 880 300 H 1040"/>
<rect class="gate" x="180" y="70" width="150" height="465" rx="12"/>
<rect class="gate" x="730" y="70" width="150" height="465" rx="12"/>
<text class="name" x="255" y="45">分线器</text><text class="name" x="805" y="45">集线器</text>
<text class="label" x="25" y="275">输入字节</text><text class="label" x="905" y="275">输出字节</text>
<path class="wire" d="M 330 105 H 475 M 585 105 H 730"/>
<rect class="gate" x="475" y="85" width="110" height="40" rx="10"/>
<text class="name" x="530" y="112">NOT</text>
<text class="label" x="275" y="111">1</text><text class="label" x="745" y="111">1</text>
<path class="wire" d="M 330 160 H 475 M 585 160 H 730"/>
<rect class="gate" x="475" y="140" width="110" height="40" rx="10"/>
<text class="name" x="530" y="167">NOT</text>
<text class="label" x="275" y="166">2</text><text class="label" x="745" y="166">2</text>
<path class="wire" d="M 330 215 H 475 M 585 215 H 730"/>
<rect class="gate" x="475" y="195" width="110" height="40" rx="10"/>
<text class="name" x="530" y="222">NOT</text>
<text class="label" x="275" y="221">4</text><text class="label" x="745" y="221">4</text>
<path class="wire" d="M 330 270 H 475 M 585 270 H 730"/>
<rect class="gate" x="475" y="250" width="110" height="40" rx="10"/>
<text class="name" x="530" y="277">NOT</text>
<text class="label" x="275" y="276">8</text><text class="label" x="745" y="276">8</text>
<path class="wire" d="M 330 325 H 475 M 585 325 H 730"/>
<rect class="gate" x="475" y="305" width="110" height="40" rx="10"/>
<text class="name" x="530" y="332">NOT</text>
<text class="label" x="275" y="331">16</text><text class="label" x="745" y="331">16</text>
<path class="wire" d="M 330 380 H 475 M 585 380 H 730"/>
<rect class="gate" x="475" y="360" width="110" height="40" rx="10"/>
<text class="name" x="530" y="387">NOT</text>
<text class="label" x="275" y="386">32</text><text class="label" x="745" y="386">32</text>
<path class="wire" d="M 330 435 H 475 M 585 435 H 730"/>
<rect class="gate" x="475" y="415" width="110" height="40" rx="10"/>
<text class="name" x="530" y="442">NOT</text>
<text class="label" x="275" y="441">64</text><text class="label" x="745" y="441">64</text>
<path class="wire" d="M 330 490 H 475 M 585 490 H 730"/>
<rect class="gate" x="475" y="470" width="110" height="40" rx="10"/>
<text class="name" x="530" y="497">NOT</text>
<text class="label" x="275" y="496">128</text><text class="label" x="745" y="496">128</text>
<text class="label" x="30" y="570">引脚数字表示位权；粗线为 8 bit，细线为 1 bit；每一位取反后仍接回原来的位置。</text></svg>
