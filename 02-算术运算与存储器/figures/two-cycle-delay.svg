<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" role="img" aria-labelledby="title desc">
<title id="title">两级保存部件实现两周期延迟</title>
<desc id="desc">输入 A 接第一级 R1，R1 接第二级 R2，输出 Q 取 R2。共同的时钟更新两级，第二级采样第一级的旧值。</desc>
<style>
.wire{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.box{fill:#eaf3ff;stroke:#334155;stroke-width:3}.dot{fill:#334155}.label{fill:#0f172a;font:18px system-ui,sans-serif}.name{fill:#0f172a;font:600 20px system-ui,sans-serif;text-anchor:middle}
@media(prefers-color-scheme:dark){.wire,.box{stroke:#cbd5e1}.box{fill:#173454}.dot{fill:#cbd5e1}.label,.name{fill:#f1f5f9}}
</style>
<path class="wire" d="M 70 115 H 200 M 400 115 H 560 M 760 115 H 890 M 160 260 H 660 V 180 M 300 260 V 180"/>
<rect class="box" x="200" y="50" width="200" height="130" rx="12"/>
<rect class="box" x="560" y="50" width="200" height="130" rx="12"/>
<circle class="dot" cx="300" cy="260" r="5"/>
<text class="name" x="300" y="92">第一级 R1</text><text class="name" x="660" y="92">第二级 R2</text>
<text class="label" x="220" y="132">保存本次输入</text><text class="label" x="580" y="132">保存 R1 的旧值</text>
<text class="label" x="35" y="121">A</text><text class="label" x="425" y="99">上一拍的值</text><text class="label" x="905" y="121">Q</text>
<text class="label" x="35" y="266">共同的时钟</text>
<text class="label" x="95" y="320">每次同时更新：R1 收下 A，R2 收下更新前的 R1。每个输入晚两拍输出。</text>
</svg>
