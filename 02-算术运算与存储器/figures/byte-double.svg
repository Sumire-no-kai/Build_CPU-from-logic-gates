<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">用一个分线器和一个集线器实现翻倍</title><desc id="desc">输入权重1到64分别接输出权重2到128，输入权重128接输出权重1。在0到127范围内，输入128位为零。</desc>
<style>.wire{fill:none;stroke:#334155;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.bus{fill:none;stroke:#334155;stroke-width:7;stroke-linecap:round}.box{fill:#eaf3ff;stroke:#334155;stroke-width:2.5}.label{fill:#0f172a;font:18px system-ui,sans-serif}.name{fill:#0f172a;font:600 20px system-ui,sans-serif;text-anchor:middle}@media(prefers-color-scheme:dark){.wire,.bus,.box{stroke:#cbd5e1}.box{fill:#173454}.label,.name{fill:#f1f5f9}}</style>
<defs><mask id="return-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="570" style="mask-type:luminance"><rect width="1080" height="570" fill="white"/>
<rect x="690" y="151.5" width="10" height="10" fill="black"/>
<rect x="690" y="191.5" width="10" height="10" fill="black"/>
<rect x="690" y="231.5" width="10" height="10" fill="black"/>
<rect x="690" y="271.5" width="10" height="10" fill="black"/>
<rect x="690" y="311.5" width="10" height="10" fill="black"/>
<rect x="690" y="351.5" width="10" height="10" fill="black"/>
<rect x="690" y="391.5" width="10" height="10" fill="black"/>
</mask></defs>
<path class="bus" d="M 40 260 H 180 M 880 260 H 1030"/>
<rect class="box" x="180" y="80" width="150" height="380" rx="12"/><rect class="box" x="730" y="80" width="150" height="380" rx="12"/>
<text class="name" x="255" y="60">分线器</text><text class="name" x="805" y="60">集线器</text><text class="label" x="30" y="230">输入字节</text><text class="label" x="905" y="230">输出字节</text>
<path class="wire" mask="url(#return-gaps)" d="M 330 400 H 365 V 495 H 695 V 120 H 730"/>
<text class="label" x="385" y="525">128 → 1：本题范围内，这一路为 0</text>
<text class="label" x="275" y="126">1</text><text class="label" x="745" y="126">1</text>
<path class="wire" d="M 330 120 L 730 160"/>
<text class="label" x="275" y="166">2</text><text class="label" x="745" y="166">2</text>
<path class="wire" d="M 330 160 L 730 200"/>
<text class="label" x="275" y="206">4</text><text class="label" x="745" y="206">4</text>
<path class="wire" d="M 330 200 L 730 240"/>
<text class="label" x="275" y="246">8</text><text class="label" x="745" y="246">8</text>
<path class="wire" d="M 330 240 L 730 280"/>
<text class="label" x="275" y="286">16</text><text class="label" x="745" y="286">16</text>
<path class="wire" d="M 330 280 L 730 320"/>
<text class="label" x="275" y="326">32</text><text class="label" x="745" y="326">32</text>
<path class="wire" d="M 330 320 L 730 360"/>
<text class="label" x="275" y="366">64</text><text class="label" x="745" y="366">64</text>
<path class="wire" d="M 330 360 L 730 400"/>
<text class="label" x="275" y="406">128</text><text class="label" x="745" y="406">128</text>
<text class="label" x="30" y="555">引脚数字表示权重；粗线为 8 bit，细线为 1 bit；交叉处空隙表示不相连。</text></svg>
