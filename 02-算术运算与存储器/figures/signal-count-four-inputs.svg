<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">四路信号计数的完整接线</title>
<desc id="desc">X=A XOR B，P=A AND B，Y=C XOR D，R=C AND D。Q1=X XOR Y，V=X AND Y，U=P XOR R，Q2=V OR U，Q4=P AND R。圆点相连，交叉处空隙不相连。</desc>
<style>

.wire{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gate{fill:#eaf3ff;stroke:#334155;stroke-width:3}.dot{fill:#334155}
.label{fill:#0f172a;font:18px system-ui,sans-serif}.name{fill:#0f172a;font:600 20px system-ui,sans-serif;text-anchor:middle}
@media(prefers-color-scheme:dark){.wire,.gate{stroke:#cbd5e1}.gate{fill:#173454}.dot{fill:#cbd5e1}.label,.name{fill:#f1f5f9}}
</style>
<defs>
<mask id="p-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="620" style="mask-type:luminance">
<rect width="1120" height="620" fill="white"/>
<rect x="355" y="235" width="10" height="10" fill="black"/>
<rect x="395" y="265" width="10" height="10" fill="black"/>
<rect x="395" y="475" width="10" height="10" fill="black"/>
</mask>
<mask id="y-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="620" style="mask-type:luminance">
<rect width="1120" height="620" fill="white"/>
<rect x="355" y="225" width="10" height="10" fill="black"/>
</mask>
<mask id="r-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="620" style="mask-type:luminance">
<rect width="1120" height="620" fill="white"/>
<rect x="435" y="485" width="10" height="10" fill="black"/>
</mask>
<mask id="input-a-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="620" style="mask-type:luminance">
<rect width="1120" height="620" fill="white"/>
<rect x="70" y="135" width="10" height="10" fill="black"/>
<rect x="105" y="215" width="10" height="10" fill="black"/>
</mask>
<mask id="input-c-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="1120" height="620" style="mask-type:luminance">
<rect width="1120" height="620" fill="white"/>
<rect x="70" y="375" width="10" height="10" fill="black"/>
<rect x="105" y="455" width="10" height="10" fill="black"/>
</mask>
</defs>
<path class="wire" d="M 260 120 H 320 M 320 100 V 230"/>
<path class="wire" mask="url(#p-gaps)" d="M 260 240 H 400 V 490"/>
<path class="wire" mask="url(#y-gap)" d="M 260 360 H 360 V 140"/>
<path class="wire" mask="url(#r-gap)" d="M 260 480 H 440 M 440 400 V 530"/>
<path class="wire" d="M 320 100 H 550"/>
<path class="wire" d="M 320 230 H 550"/>
<path class="wire" d="M 360 140 H 550"/>
<path class="wire" d="M 360 270 H 550"/>
<path class="wire" d="M 400 360 H 550"/>
<path class="wire" d="M 400 490 H 550"/>
<path class="wire" d="M 440 400 H 550"/>
<path class="wire" d="M 440 530 H 550"/>
<path class="wire" d="M 660 120 H 1000"/>
<path class="wire" d="M 660 250 H 750 V 290 H 850"/>
<path class="wire" d="M 660 380 H 790 V 330 H 850"/>
<path class="wire" d="M 960 310 H 1000"/>
<path class="wire" d="M 660 510 H 1000"/>
<path class="wire" mask="url(#input-a-gaps)" d="M 45 100 H 150 M 75 100 V 220 H 150"/>
<path class="wire" d="M 45 140 H 150 M 110 140 V 260 H 150"/>
<path class="wire" mask="url(#input-c-gaps)" d="M 45 340 H 150 M 75 340 V 460 H 150"/>
<path class="wire" d="M 45 380 H 150 M 110 380 V 500 H 150"/>
<circle class="dot" cx="320" cy="120" r="5"/>
<circle class="dot" cx="360" cy="270" r="5"/>
<circle class="dot" cx="400" cy="360" r="5"/>
<circle class="dot" cx="440" cy="480" r="5"/>
<circle class="dot" cx="75" cy="100" r="5"/>
<circle class="dot" cx="110" cy="140" r="5"/>
<circle class="dot" cx="75" cy="340" r="5"/>
<circle class="dot" cx="110" cy="380" r="5"/>
<rect class="gate" x="150" y="80" width="110" height="80" rx="12"/><text class="name" x="205" y="127">XOR</text>
<rect class="gate" x="150" y="200" width="110" height="80" rx="12"/><text class="name" x="205" y="247">AND</text>
<rect class="gate" x="150" y="320" width="110" height="80" rx="12"/><text class="name" x="205" y="367">XOR</text>
<rect class="gate" x="150" y="440" width="110" height="80" rx="12"/><text class="name" x="205" y="487">AND</text>
<rect class="gate" x="550" y="80" width="110" height="80" rx="12"/><text class="name" x="605" y="127">XOR</text>
<rect class="gate" x="550" y="210" width="110" height="80" rx="12"/><text class="name" x="605" y="257">AND</text>
<rect class="gate" x="550" y="340" width="110" height="80" rx="12"/><text class="name" x="605" y="387">XOR</text>
<rect class="gate" x="550" y="470" width="110" height="80" rx="12"/><text class="name" x="605" y="517">AND</text>
<rect class="gate" x="850" y="270" width="110" height="80" rx="12"/><text class="name" x="905" y="317">OR</text>
<text class="label" x="30" y="32">四路输入 → 两组计数 → 合并为三个二进制输出位</text>
<text class="label" x="20" y="106">A</text>
<text class="label" x="20" y="146">B</text>
<text class="label" x="20" y="346">C</text>
<text class="label" x="20" y="386">D</text>
<text class="label" x="275" y="108">X</text>
<text class="label" x="275" y="228">P</text>
<text class="label" x="275" y="348">Y</text>
<text class="label" x="275" y="468">R</text>
<text class="label" x="685" y="238">V</text>
<text class="label" x="685" y="368">U</text>
<text class="label" x="1010" y="126">Q1 × 1</text>
<text class="label" x="1010" y="316">Q2 × 2</text>
<text class="label" x="1010" y="516">Q4 × 4</text>
<text class="label" x="30" y="584">● 表示导线相连；交叉处留空隙表示不相连。输出按 Q4、Q2、Q1 读作二进制数。</text>
</svg>
